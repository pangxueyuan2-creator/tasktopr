name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff mypy bandit build pip-audit
      - name: Unit and integration tests with coverage
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Static types
        run: mypy src/tasktopr
      - name: Security scan
        run: bandit -q -c .bandit -r src
      - name: Dependency audit
        run: pip-audit . --strict
      - name: Build distributions
        run: python -m build
