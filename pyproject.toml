[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "tasktopr"
version = "0.1.0"
description = "Turn a GitHub Issue into a transparent, tested Pull Request."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TaskToPR contributors"}]
keywords = ["ai-agent", "coding-agent", "github", "pull-request", "developer-tools", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/pangxueyuan2-creator/tasktopr"
Repository = "https://github.com/pangxueyuan2-creator/tasktopr"
Issues = "https://github.com/pangxueyuan2-creator/tasktopr/issues"

[project.scripts]
tasktopr = "tasktopr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # Long JSON prompts and exact patch fixtures are intentionally preserved.

[tool.ruff.lint.isort]
known-first-party = ["tasktopr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=tasktopr --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["tasktopr"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tasktopr"]
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests", "demo"]
# Subprocess is a deliberate core capability: every invocation is argument-array based,
# shell=False, scoped to the local repository, and guarded by the command/Git policy.
skips = ["B404", "B603", "B607"]
